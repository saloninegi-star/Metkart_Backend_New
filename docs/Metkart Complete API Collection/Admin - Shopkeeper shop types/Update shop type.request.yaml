$kind: http-request
description: Admin Bearer token required. multipart/form-data; icon is optional.
url: "{{baseUrl}}/api/admin/shopkeeper/shoptype/{{id}}"
method: PUT
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Grocery
    - type: text
      key: subtitle
      value: Daily essentials
    - type: text
      key: isActive
      value: "true"
    - type: file
      key: icon
      src: []
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 5000
