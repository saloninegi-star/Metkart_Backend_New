$kind: http-request
description: Admin Bearer token required.
url: "{{baseUrl}}/api/admin/shopkeeper/shopcategory/{{shopTypeId}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Fresh Produce",
      "sortOrder": 1,
      "isActive": true
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 2000
