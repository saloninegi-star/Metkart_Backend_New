$kind: http-example
name: "Step 8a: Verify UPI ID"
request:
  url: "{{baseUrl}}/api/delivery/onboarding/upi/verify"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{riderToken}}
    Idempotency-Key: "{{$guid}}"
  body:
    type: text
    content: |-
      {
        "upiId": "rider@oksbi"
      }
