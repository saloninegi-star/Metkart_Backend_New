$kind: http-request
description: admin authenticated endpoint.
url: "{{baseUrl}}/api/admin/vendor/productcategory/detail/{{id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productCategoryName": "Beverages",
      "isActive": true
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 5000
