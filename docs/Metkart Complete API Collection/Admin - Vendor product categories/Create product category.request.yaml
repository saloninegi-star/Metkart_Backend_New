$kind: http-request
description: admin authenticated endpoint.
url: "{{baseUrl}}/api/admin/vendor/productcategory/{{shopTypeId}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productCategoryName": "Beverages"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 3000
