$kind: http-request
name: Update Contact Phone (/api/delivery/onboarding/contact)
description: Updates rider mobile contact number. Also accessible via `PATCH {{baseUrl}}/api/rider/onboarding/contact`.
url: "{{baseUrl}}/api/delivery/onboarding/contact"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{riderToken}}
body:
  type: text
  content: |-
    {
      "phone": "9876543210"
    }
order: 6000
