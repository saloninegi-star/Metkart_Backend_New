$kind: http-request
name: Resend Email OTP (/api/delivery/auth/otp/resend)
description: Resends 6-digit email OTP (enforces 45s cooldown). Also accessible via `POST {{baseUrl}}/api/rider/auth/otp/resend`.
url: "{{baseUrl}}/api/delivery/auth/otp/resend"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{$guid}}"
body:
  type: text
  content: |-
    {
      "email": "rider@example.com"
    }
order: 3000
