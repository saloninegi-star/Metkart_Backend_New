$kind: http-request
description: multipart/form-data. All fields are optional for update; upload images to replace the current set.
url: "{{baseUrl}}/api/vendor/products/{{productId}}"
method: PUT
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Organic Apples
    - type: text
      key: category
      value: Fresh Produce
    - type: text
      key: description
      value: Fresh apples
    - type: text
      key: weightVolume
      value: 1 kg
    - type: text
      key: price
      value: "5.99"
    - type: text
      key: availableQuantity
      value: "25"
    - type: text
      key: status
      value: draft
    - type: file
      key: images
      src: []
auth:
  type: bearer
  credentials:
    token: "{{vendorToken}}"
order: 4000
